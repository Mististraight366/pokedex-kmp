name: Baseline Profile

# Regenerates the baseline profile on a Gradle managed device and opens a PR when it changes.
# Manual because a profile run takes several minutes and its output only needs refreshing when
# the startup path actually moves.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate baseline profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :app:androidApp:generateReleaseBaselineProfile --stacktrace

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Regenerate baseline profile"
          title: "Regenerate baseline profile"
          body: |
            Regenerated by the Baseline Profile workflow on the `pixel6api31` managed device.
          branch: chore/baseline-profile
          add-paths: app/androidApp/src/release/generated/baselineProfiles/*
