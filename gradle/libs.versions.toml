cloudy = { module = "com.github.skydoves:cloudy", version.ref = "cloudy" }
# The annotations-only slice of the Compose runtime, so `core:model` can be `@Immutable`
# without dragging the whole runtime into a pure data module.
compose-runtime-annotation = { module = "androidx.compose.runtime:runtime-annotation", version.ref = "composeRuntimeAnnotation" }
