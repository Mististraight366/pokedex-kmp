name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck --stacktrace

  jvm:
    name: Unit tests (JVM, Android, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The desktop, Android host, and wasm targets all run the same commonTest sources.
      - run: ./gradlew desktopTest testAndroidHostTest wasmJsBrowserTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  android:
    name: Android APK + Paparazzi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:androidApp:assembleDebug --stacktrace
      # Golden image verification. Re-record with `:app:screenshot:recordPaparazziDebug`.
      - run: ./gradlew :app:screenshot:verifyPaparazziDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: paparazzi-diffs
          path: app/screenshot/build/reports/paparazzi/**

  web:
    name: Web (wasmJs) distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:webApp:wasmJsBrowserDistribution --stacktrace

  apple:
    name: iOS framework + desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - run: ./gradlew :app:desktopApp:assemble --stacktrace

  navgraph:
    name: Navigation graph check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Fails if a destination or transition changed without updating app/shared/nav/shared.nav.
      # Refresh the baseline with `./gradlew :app:shared:navDump`.
      - run: ./gradlew :app:shared:navCheck --stacktrace
      - run: ./gradlew :app:shared:exportNavGraphImage --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nav-graph
          path: app/shared/build/navgraph/**
