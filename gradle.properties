# https://docs.gradle.org/current/userguide/build_environment.html#sec:configuring_jvm_memory
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g

# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin's wasmJs target does not support configuration on demand (KT-52074).
org.gradle.configureondemand=false

# KSP2 (Room compiler) does not yet snapshot cleanly under the Gradle 9 configuration cache.
org.gradle.configuration-cache=false

# AndroidX Migration https://developer.android.com/jetpack/androidx/migrate
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Multiplatform
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.binary.gc=cms
kotlin.native.binary.smallBinary=true
kotlin.incremental.native=true

# Compose Multiplatform
compose.resources.always.generate.accessors=true
org.jetbrains.compose.experimental.wasm.enabled=true
